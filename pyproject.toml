[project]
name = "kathara-gui"
version = "0.1.0"
description = "Graphical environment for modeling, deploying and verifying Kathara network topologies"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13",
    "pydantic>=2.9",
    "kathara>=3.8",
    "docker>=7.1",
    "cryptography>=43",
]

[project.scripts]
kathara-gui = "kathara_gui.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.7",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kathara_gui"]
# The built interface is gitignored, and hatchling leaves out what git ignores,
# so without this an installed copy served a 404 at every page (F45). Artifacts
# are hatchling's way to ship a build product that is not in git.
artifacts = ["src/kathara_gui/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Docker-dependent tests are opt-in: they only run where a daemon exists.
markers = ["docker: requires a running Docker daemon and Kathara"]
addopts = "-m 'not docker'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in a default is FastAPI's documented idiom, not the mutable
# default argument B008 is meant to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]
