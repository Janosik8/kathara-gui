name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The application is developed on macOS but must run on Windows and Linux.
  # Path handling, line endings and reserved filenames only diverge on the
  # real OS, so the unit suite runs on all three from the start.
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
        include:
          # 3.14 is newer than most of the dependency tree; verify on one OS
          # so a break is visible without tripling the matrix.
          - os: ubuntu-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --python ${{ matrix.python }} --all-extras --dev
      - name: Lint
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest -q

  # Guards the distribution promise: a user can install from a clean checkout
  # and the command works. Replaces the binary-packaging gate.
  install-smoke:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install as a tool
        run: uv tool install .
      - name: Command is on PATH and starts
        run: |
          kathara-gui --version
          kathara-gui --check

  # Kathara needs Linux containers, which Windows runners cannot provide.
  integration:
    name: integration (docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Vertical spike against a real daemon
        run: uv run python scripts/spike_vertical.py
      - name: Docker-marked tests
        run: uv run pytest -q -m docker
